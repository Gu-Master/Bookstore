<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книги</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="shell">
    <nav class="nav">
        <a th:href="@{/borrowings}">Выдачи</a>
        <a class="active" th:href="@{/books}">Книги</a>
        <a th:href="@{/clients}">Клиенты</a>
        <a th:href="@{/api/readers}" target="_blank">REST JSON</a>
    </nav>

    <section class="card">
        <div class="header">
            <div>
                <h1>Книги</h1>
                <p class="muted">Список книг библиотеки с пагинацией по 20 записей.</p>
            </div>
            <a class="button" th:href="@{/books/new}">Добавить книгу</a>
        </div>

        <div class="empty" th:if="${books.isEmpty()}">Книг пока нет.</div>

        <table th:if="${!books.isEmpty()}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Наименование</th>
                <th>Автор</th>
                <th>ISBN</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books.content}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">Наименование</td>
                <td th:text="${book.author}">Автор</td>
                <td th:text="${book.isbn}">ISBN</td>
                <td>
                    <div class="actions">
                        <a class="button secondary" th:href="@{/books/{id}/edit(id=${book.id})}">Редактировать</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="toolbar">
            <span class="muted" th:text="|Страница ${books.number + 1} из ${books.totalPages == 0 ? 1 : books.totalPages}|"></span>
            <div class="actions">
                <a class="button secondary" th:if="${books.hasPrevious()}" th:href="@{/books(page=${books.number - 1})}">Назад</a>
                <a class="button secondary" th:if="${books.hasNext()}" th:href="@{/books(page=${books.number + 1})}">Вперед</a>
            </div>
        </div>
    </section>
</div>
</body>
</html>
